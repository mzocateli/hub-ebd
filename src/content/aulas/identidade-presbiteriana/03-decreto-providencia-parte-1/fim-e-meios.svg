<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Dentro do propósito que abrange todas as coisas (Efésios 1.10-11): escolhidos em Cristo (v. 4), depois os meios, ouvir e crer (v. 13), e o fim, herança, louvor e glória (v. 14). Embaixo: Deus ordena o fim e também os meios.">
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="10" y="10" width="620" height="252" rx="12" fill="#e9ecef" stroke="#2c5234" stroke-width="2"/>
  <text x="30" y="44" text-anchor="start" font-size="19" font-weight="700" fill="#2c5234">Todas as coisas (propósito) · vv. 10-11</text>

  <rect x="28" y="66" width="168" height="134" rx="12" fill="#2c5234"/>
  <text x="112" y="116" font-size="22" font-weight="700" fill="#ffffff">Escolhidos</text>
  <text x="112" y="144" font-size="22" font-weight="700" fill="#ffffff">em Cristo</text>
  <text x="112" y="176" font-size="18" fill="#e0b84a">v. 4</text>

  <polygon points="202,124 216,124 216,114 230,133 216,152 216,142 202,142" fill="#9a7b2e"/>

  <rect x="236" y="66" width="170" height="134" rx="12" fill="#ffffff" stroke="#9a7b2e" stroke-width="2.5"/>
  <text x="321" y="102" font-size="16" font-weight="700" letter-spacing="1" fill="#9a7b2e">MEIOS</text>
  <text x="321" y="138" font-size="22" font-weight="700" fill="#2c5234">Ouvir e crer</text>
  <text x="321" y="174" font-size="18" fill="#5f6b76">v. 13</text>

  <polygon points="412,124 426,124 426,114 440,133 426,152 426,142 412,142" fill="#9a7b2e"/>

  <rect x="446" y="66" width="170" height="134" rx="12" fill="#f3db8e"/>
  <text x="531" y="96" font-size="16" font-weight="700" letter-spacing="1" fill="#2c5234">FIM</text>
  <text x="531" y="126" font-size="21" font-weight="700" fill="#1c3622">Herança,</text>
  <text x="531" y="152" font-size="21" font-weight="700" fill="#1c3622">louvor, glória</text>
  <text x="531" y="180" font-size="18" fill="#1c3622">v. 14</text>

  <rect x="314" y="222" width="14" height="96" fill="#2c5234"/>
  <polygon points="303,224 321,202 339,224" fill="#2c5234"/>
  <rect x="524" y="222" width="14" height="96" fill="#2c5234"/>
  <polygon points="513,224 531,202 549,224" fill="#2c5234"/>

  <rect x="10" y="316" width="620" height="72" fill="#2c5234"/>
  <text x="320" y="360" font-size="23" font-weight="700" fill="#ffffff">Deus ordena o fim e também os meios</text>
</g>
</svg>
