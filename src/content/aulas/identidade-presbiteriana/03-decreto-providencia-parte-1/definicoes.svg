<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-label="Decreto: o propósito eterno de Deus (Breve Catecismo, resposta 7). Dentro dele, a predestinação: a escolha para a vida eterna. O decreto é executado (resposta 8) na criação e na providência; providência é preservar e governar as criaturas e suas ações (resposta 11). Nota: na resposta 7, predestinou tem sentido amplo, tudo o que acontece.">
<rect width="640" height="450" fill="#ffffff"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="10" y="10" width="620" height="180" rx="12" fill="#2c5234"/>
  <text x="34" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#ffffff">Decreto</text>
  <text x="34" y="86" text-anchor="start" font-size="19" fill="#f3db8e">o propósito eterno de Deus · BCW 7</text>
  <rect x="34" y="104" width="572" height="68" rx="10" fill="#1c3622" stroke="#e0b84a" stroke-width="2"/>
  <text x="320" y="133" font-size="21" font-weight="700" fill="#e0b84a">Predestinação</text>
  <text x="320" y="159" font-size="18" fill="#ffffff">a escolha para a vida eterna</text>

  <polygon points="296,198 344,198 320,230" fill="#9a7b2e"/>
  <text x="356" y="222" text-anchor="start" font-size="18" fill="#9a7b2e"><tspan font-weight="700">execução</tspan> · BCW 8</text>

  <polyline points="160,262 160,242 480,242 480,262" fill="none" stroke="#9a7b2e" stroke-width="2.5"/>

  <rect x="10" y="262" width="300" height="122" fill="#e9ecef"/>
  <rect x="10" y="262" width="7" height="122" fill="#2c5234"/>
  <text x="163" y="331" font-size="24" font-weight="700" fill="#2c5234">Criação</text>

  <rect x="330" y="262" width="300" height="122" fill="#e9ecef"/>
  <rect x="330" y="262" width="7" height="122" fill="#2c5234"/>
  <text x="483" y="298" font-size="24" font-weight="700" fill="#2c5234">Providência</text>
  <text x="483" y="327" font-size="17" fill="#222222">preservar e governar</text>
  <text x="483" y="350" font-size="17" fill="#222222">as criaturas e suas ações</text>
  <text x="483" y="373" font-size="17" fill="#222222">BCW 11</text>

  <rect x="10" y="404" width="5" height="34" fill="#9a7b2e"/>
  <text x="28" y="427" text-anchor="start" font-size="17" font-style="italic" fill="#5f6b76">“Predestinou” na resposta 7 do BCW: sentido amplo, tudo o que acontece</text>
</g>
</svg>
