<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="Duas perguntas com respostas diferentes. Por que alguém é salvo? A causa é só a graça de Deus (Efésios 1.5; Confissão III.V), e não fé ou obras previstas; o meio é a fé, que recebe Cristo (Efésios 1.13). Por que alguém é condenado? A causa é o seu próprio pecado (Confissão III.VII), e Deus não é autor do pecado. Ninguém é salvo por mérito; ninguém é condenado sem culpa.">
<rect width="640" height="470" fill="#ffffff"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <!-- Salvação -->
  <rect x="10" y="10" width="302" height="372" rx="12" fill="#ffffff" stroke="#2c5234" stroke-width="2"/>
  <text x="161" y="44" font-size="20" font-weight="700" fill="#2c5234">Por que alguém é salvo?</text>

  <rect x="26" y="60" width="270" height="112" rx="10" fill="#2c5234"/>
  <text x="161" y="86" font-size="15" font-weight="700" letter-spacing="1" fill="#f3db8e">A CAUSA</text>
  <text x="161" y="120" font-size="23" font-weight="700" fill="#ffffff">Só a graça de Deus</text>
  <text x="161" y="152" font-size="17" fill="#f3db8e">Ef 1.5 · CFW III.V</text>

  <rect x="26" y="184" width="270" height="62" rx="10" fill="#ffffff" stroke="#b03a2e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="161" y="210" font-size="18" fill="#b03a2e">✕ <tspan text-decoration="line-through">fé ou obras previstas</tspan></text>
  <text x="161" y="234" font-size="16" fill="#5f6b76">não é a causa</text>

  <rect x="26" y="258" width="270" height="110" rx="10" fill="#ffffff" stroke="#9a7b2e" stroke-width="2.5"/>
  <text x="161" y="284" font-size="15" font-weight="700" letter-spacing="1" fill="#9a7b2e">O MEIO</text>
  <text x="161" y="316" font-size="21" font-weight="700" fill="#2c5234">A fé, que recebe Cristo</text>
  <text x="161" y="348" font-size="17" fill="#5f6b76">Ef 1.13</text>

  <!-- Condenação -->
  <rect x="328" y="10" width="302" height="372" rx="12" fill="#ffffff" stroke="#5f6b76" stroke-width="2"/>
  <text x="479" y="44" font-size="19" font-weight="700" fill="#1c3622">Por que alguém é condenado?</text>

  <rect x="344" y="60" width="270" height="112" rx="10" fill="#5f6b76"/>
  <text x="479" y="86" font-size="15" font-weight="700" letter-spacing="1" fill="#f3db8e">A CAUSA</text>
  <text x="479" y="120" font-size="22" font-weight="700" fill="#ffffff">O seu próprio pecado</text>
  <text x="479" y="152" font-size="17" fill="#f3db8e">CFW III.VII</text>

  <rect x="344" y="184" width="270" height="62" rx="10" fill="#ffffff" stroke="#b03a2e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="479" y="210" font-size="18" fill="#b03a2e">✕ <tspan text-decoration="line-through">Deus, autor do pecado</tspan></text>
  <text x="479" y="234" font-size="16" fill="#5f6b76">não é a causa</text>

  <text x="479" y="300" font-size="19" font-style="italic" fill="#1c3622">“por causa dos</text>
  <text x="479" y="326" font-size="19" font-style="italic" fill="#1c3622">seus pecados”</text>
  <text x="479" y="354" font-size="16" fill="#5f6b76">CFW III.VII</text>

  <rect x="10" y="396" width="620" height="64" fill="#2c5234"/>
  <text x="320" y="424" font-size="19" font-weight="700" fill="#ffffff">Ninguém é salvo por mérito.</text>
  <text x="320" y="448" font-size="19" font-weight="700" fill="#ffffff">Ninguém é condenado sem culpa.</text>
</g>
</svg>
