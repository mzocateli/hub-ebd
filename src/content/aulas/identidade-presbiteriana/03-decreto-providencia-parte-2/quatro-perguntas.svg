<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Quatro perguntas sobre o feijoeiro e seu desenvolvimento. Material: de que é feito? Formal: que tipo de ser é? Eficiente: o que produz a mudança? Final: para que se dirige?">
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <g stroke="#5f6b76" stroke-width="2.5">
    <line x1="200" y1="112" x2="258" y2="158"/>
    <line x1="440" y1="112" x2="382" y2="158"/>
    <line x1="200" y1="288" x2="258" y2="242"/>
    <line x1="440" y1="288" x2="382" y2="242"/>
  </g>

  <rect x="10" y="10" width="270" height="102" rx="12" fill="#e7efe6"/>
  <text x="145" y="52" font-size="21" font-weight="700" letter-spacing="1" fill="#2c5234">MATERIAL</text>
  <text x="145" y="86" font-size="21" fill="#1c3622">De que é feito?</text>

  <rect x="360" y="10" width="270" height="102" rx="12" fill="#e7efe6"/>
  <text x="495" y="52" font-size="21" font-weight="700" letter-spacing="1" fill="#2c5234">FORMAL</text>
  <text x="495" y="86" font-size="21" fill="#1c3622">Que tipo de ser é?</text>

  <rect x="190" y="150" width="260" height="100" rx="12" fill="#f3db8e"/>
  <text x="320" y="194" font-size="23" font-weight="700" fill="#1c3622">O FEIJOEIRO</text>
  <text x="320" y="226" font-size="20" fill="#1c3622">e seu desenvolvimento</text>

  <rect x="10" y="288" width="270" height="102" rx="12" fill="#e7efe6"/>
  <text x="145" y="330" font-size="21" font-weight="700" letter-spacing="1" fill="#2c5234">EFICIENTE</text>
  <text x="145" y="364" font-size="20" fill="#1c3622">O que produz a mudança?</text>

  <rect x="360" y="288" width="270" height="102" rx="12" fill="#e7efe6"/>
  <text x="495" y="330" font-size="21" font-weight="700" letter-spacing="1" fill="#2c5234">FINAL</text>
  <text x="495" y="364" font-size="21" fill="#1c3622">Para que se dirige?</text>
</g>
</svg>
