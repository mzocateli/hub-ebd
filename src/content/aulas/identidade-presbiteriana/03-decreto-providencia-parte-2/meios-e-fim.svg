<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Três linhas com os meios e o fim. Miguel e o feijão: plantar e regar levam à colheita. Efésios 1.13: ouvir e crer levam à salvação. Oração: a petição real leva ao propósito cumprido. Embaixo: Deus ordena o fim e também os meios.">
<rect width="640" height="430" fill="#ffffff"/>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
  <text x="170" y="30" font-size="18" font-weight="700" letter-spacing="1" fill="#9a7b2e">OS MEIOS</text>
  <text x="490" y="30" font-size="18" font-weight="700" letter-spacing="1" fill="#9a7b2e">O FIM</text>

  <text x="10" y="64" text-anchor="start" font-size="18" font-weight="700" fill="#2c5234">Miguel e o feijão</text>
  <rect x="10" y="74" width="320" height="56" rx="10" fill="#e9ecef"/>
  <text x="170" y="110" font-size="22" fill="#1c3622">Plantar e regar</text>
  <polygon points="338,94 354,94 354,84 372,102 354,120 354,110 338,110" fill="#9a7b2e"/>
  <rect x="380" y="74" width="250" height="56" rx="10" fill="#f3db8e"/>
  <text x="505" y="110" font-size="22" font-weight="700" fill="#1c3622">A colheita</text>

  <text x="10" y="164" text-anchor="start" font-size="18" font-weight="700" fill="#2c5234">Efésios 1.13</text>
  <rect x="10" y="174" width="320" height="56" rx="10" fill="#e9ecef"/>
  <text x="170" y="210" font-size="22" fill="#1c3622">Ouvir e crer</text>
  <polygon points="338,194 354,194 354,184 372,202 354,220 354,210 338,210" fill="#9a7b2e"/>
  <rect x="380" y="174" width="250" height="56" rx="10" fill="#f3db8e"/>
  <text x="505" y="210" font-size="22" font-weight="700" fill="#1c3622">Salvação</text>

  <text x="10" y="264" text-anchor="start" font-size="18" font-weight="700" fill="#2c5234">Oração</text>
  <rect x="10" y="274" width="320" height="56" rx="10" fill="#e9ecef"/>
  <text x="170" y="310" font-size="22" fill="#1c3622">Petição real</text>
  <polygon points="338,294 354,294 354,284 372,302 354,320 354,310 338,310" fill="#9a7b2e"/>
  <rect x="380" y="274" width="250" height="56" rx="10" fill="#f3db8e"/>
  <text x="505" y="310" font-size="21" font-weight="700" fill="#1c3622">Propósito cumprido</text>

  <polygon points="152,360 170,338 188,360" fill="#2c5234"/>
  <polygon points="487,360 505,338 523,360" fill="#2c5234"/>
  <rect x="10" y="358" width="620" height="62" fill="#2c5234"/>
  <text x="320" y="397" font-size="23" font-weight="700" fill="#ffffff">Deus ordena o fim e também os meios</text>
</g>
</svg>
